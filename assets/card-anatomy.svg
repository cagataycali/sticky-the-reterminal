<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 360" font-family="Inter, -apple-system, sans-serif">
  <defs>
    <style>
      .wire { stroke:#8a8a8a; stroke-width:1.5; fill:none; }
      .lbl  { fill:#8a8a8a; font-size:13px; }
      .sub  { fill:#8a8a8a; font-size:10px; opacity:.75; }
      .cy   { stroke:#00b8c8; stroke-width:1.5; fill:none; }
      .cylbl{ fill:#00b8c8; font-size:12px; font-weight:600; }
    </style>
  </defs>

  <!-- panel -->
  <rect x="30" y="20" width="360" height="216" rx="6" class="wire" stroke-width="2.5"/>

  <!-- title bar -->
  <rect x="42" y="32" width="336" height="30" class="cy"/>
  <text x="52" y="52" class="lbl">Dinner</text>
  <text x="300" y="52" class="sub">19:04 · 84% · w+</text>
  <line x1="378" y1="47" x2="470" y2="47" class="cy"/>
  <text x="476" y="44" class="cylbl">title</text>
  <text x="476" y="58" class="sub">+ glance cluster</text>

  <!-- body -->
  <rect x="42" y="70" width="336" height="96" class="cy"/>
  <text x="52" y="92" class="lbl">Back at 19:30.</text>
  <text x="52" y="110" class="lbl">Pizza in the fridge.</text>
  <line x1="378" y1="118" x2="470" y2="118" class="cy"/>
  <text x="476" y="115" class="cylbl">body</text>
  <text x="476" y="129" class="sub">wraps · scrolls</text>

  <!-- buttons -->
  <rect x="42" y="174" width="336" height="34" class="cy"/>
  <rect x="52" y="179" width="150" height="24" rx="5" class="wire"/>
  <text x="127" y="195" text-anchor="middle" class="lbl">Done</text>
  <rect x="216" y="179" width="150" height="24" rx="5" class="wire"/>
  <text x="291" y="195" text-anchor="middle" class="lbl">Later</text>
  <line x1="378" y1="191" x2="470" y2="191" class="cy"/>
  <text x="476" y="188" class="cylbl">buttons</text>
  <text x="476" y="202" class="sub">≤4 · taps flow back</text>

  <!-- footer -->
  <text x="52" y="226" class="sub">from tiny · card_id=dinner</text>
  <line x1="220" y1="222" x2="470" y2="222" class="cy"/>
  <text x="476" y="225" class="cylbl">footer</text>

  <!-- tap flow -->
  <text x="30" y="272" class="lbl">a tap on [Done] →</text>
  <text x="160" y="272" class="sub">ui_tap {card_id:"dinner", button_id:"done"}</text>
  <text x="160" y="290" class="sub">→ owner's activity feed → agent answers with the next card</text>
  <text x="30" y="322" class="cylbl">The screen is a conversation.</text>
</svg>
