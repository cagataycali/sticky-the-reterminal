<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 170" font-family="Inter, -apple-system, sans-serif">
  <defs>
    <style>
      .wire { stroke:#8a8a8a; stroke-width:1.5; fill:none; }
      .box  { fill:none; stroke:#8a8a8a; stroke-width:1.5; }
      .lbl  { fill:#8a8a8a; font-size:13px; }
      .sub  { fill:#8a8a8a; font-size:10px; opacity:.75; }
      .me   { stroke:#00b8c8; stroke-width:2.5; }
      .melbl{ fill:#00b8c8; font-weight:600; }
      .arr  { fill:#8a8a8a; }
    </style>
    <marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" class="arr"/>
    </marker>
  </defs>

  <rect x="16"  y="55" width="120" height="60" rx="8" class="box"/>
  <text x="76" y="80" text-anchor="middle" class="lbl">power on</text>
  <text x="76" y="97" text-anchor="middle" class="sub">latch held, NVS read</text>

  <line x1="136" y1="85" x2="196" y2="85" class="wire" marker-end="url(#a)"/>
  <text x="166" y="75" text-anchor="middle" class="sub">no token?</text>

  <rect x="200" y="55" width="150" height="60" rx="8" class="box"/>
  <text x="275" y="80" text-anchor="middle" class="lbl">portal opens</text>
  <text x="275" y="97" text-anchor="middle" class="sub">AP tiny-XXXX · QR on glass</text>

  <line x1="350" y1="85" x2="410" y2="85" class="wire" marker-end="url(#a)"/>
  <text x="380" y="75" text-anchor="middle" class="sub">iOS app</text>

  <rect x="414" y="55" width="140" height="60" rx="8" class="box"/>
  <text x="484" y="80" text-anchor="middle" class="lbl">POST /setup</text>
  <text x="484" y="97" text-anchor="middle" class="sub">token + Wi-Fi → NVS, reboot</text>

  <line x1="554" y1="85" x2="614" y2="85" class="wire me" marker-end="url(#a)"/>

  <rect x="618" y="55" width="126" height="60" rx="8" class="box me"/>
  <text x="681" y="80" text-anchor="middle" class="lbl melbl">alive</text>
  <text x="681" y="97" text-anchor="middle" class="sub">heartbeat 30s · poll 5s</text>
</svg>
