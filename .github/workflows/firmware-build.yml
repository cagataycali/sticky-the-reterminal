# Firmware build check, on demand only (no push trigger yet — enable it when the
# repository has Actions minutes to spend). Run from the Actions tab: it builds
# the same artefact tools/flash.sh flashes and uploads the binaries.
name: firmware-build
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    container: espressif/idf:v5.4
    steps:
      - uses: actions/checkout@v4
      - name: idf.py build
        shell: bash
        run: |
          . $IDF_PATH/export.sh
          cd firmware && idf.py build
      - uses: actions/upload-artifact@v4
        with:
          name: tiny_sticky-${{ github.sha }}
          path: |
            firmware/build/tiny_sticky.bin
            firmware/build/bootloader/bootloader.bin
            firmware/build/partition_table/partition-table.bin
            firmware/build/ota_data_initial.bin
            firmware/build/flash_args
  host-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: tests/run.sh
